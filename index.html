<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Practice</title>
    /* Exer 1 */
    <style>
        .box 
            width : 200px;
            background-color : lightblue;
        .content-only
         padding : 0;
         
         .with-padding
           padding: 20px ;

           .with-border
            padding: 20px
            border: 4px solid black;

            .with-margin
             padding: 20px;
             border: 4px solid black;
             margin: 32px ;
    </style>
    </head>
    <body>
        <h1>Box Model Practice</h1>
        <h2>Exercise 1</h2>
        <div class="box content content-only">Content</div>
        <div class="box with-padding">+ Padding</div>
        <div class="box with-border">+ Border</div>
        <div class="box with-margin">+ Margin</div>

    </body>
    </html>

    
    

</html>
