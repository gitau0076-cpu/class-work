<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Practice</title>
    /* Exer 1 */
    <style>
        /* STEP 1: Four boxes with different box-model setups */
    .box {
      width: 200px;
      background-color: lightblue;
    }
    .content-only { padding: 0; }
    .with-padding { padding: 20px; }
    .with-border { padding: 20px; border: 4px solid black; }
    .with-margin { padding: 20px; border: 4px solid black; margin: 32px; }

    /* STEP 2: Fix the broken box */
    .broken-box {
      width: 300px;
      padding: 20px;
      border: none;
      background: #ffe0e0;
      box-sizing: border-box; /* ADD THIS to make it exactly 300px wide */
      }
    </style>
    </head>
    <body>
        <h1>Box Model Practice</h1>
        <h2>Exercise 1 - The Four Layers</h2>
        <div class="box content-only">Content</div>
        <div class="box with-padding">Padding</div>
        <div class="box with-border">Border</div>
        <div class="box with-margin">Margin</div>
        <h2>Exercise 2 - The Broken Box</h2>
  <div class="box broken-box">This box should be 300px wide (if not, fix it)</div>
    <h2>Exercise 3 - The Card</h2>
    <article class="card">
    <img src="https://placehold.co/320x180" alt="Gray placeholder for an image screenshot">
    <h3>Project Title</h3>
    <p>2-3 sentences about the project, written by you.</p>
    <button type="button">View Project</button>
  </article>

        
    </body>
    </html>

    
    

</html>
